<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Devant</title>
  <link rel="stylesheet" href="Style.css" />
</head>
<body>
  <header class="topbar" role="banner">
    <button id="settingsBtn" class="icon-button" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsPanel" title="Settings">⚙️</button>

    <div id="settingsPanel" class="settings-panel" role="dialog" aria-label="Settings" aria-hidden="true">
      <div class="settings-header">
        <h3>Settings</h3>
        <button id="closeSettings" class="close-btn" aria-label="Close">✖</button>
      </div>

      <form id="settingsForm" class="settings-form" onsubmit="return false;">
        <div class="setting-row">
          <label for="suggestions">Search suggestions</label>
          <input id="suggestions" type="checkbox" />
        </div>

        <div class="setting-row">
          <label for="safesearch">SafeSearch</label>
          <select id="safesearch">
            <option value="off">Off</option>
            <option value="moderate">Moderate</option>
            <option value="strict">Strict</option>
          </select>
        </div>

        <div class="setting-row">
          <label for="language">Language</label>
          <select id="language">
            <option value="auto">Auto</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
          </select>
        </div>

        <div class="setting-row">
          <label>Theme</label>
          <div class="theme-options">
            <label><input name="theme" type="radio" value="dark" /> Dark</label>
            <label><input name="theme" type="radio" value="light" /> Light</label>
          </div>
        </div>

        <div class="settings-actions">
          <button id="saveSettings" type="button">Save</button>
          <button id="cancelSettings" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </header>

  <main class="center-page" role="main">
    <!-- Banner/logo: prefer uploaded logo.png (repo root). If missing, the inline SVG will be shown. -->
    <div class="logo-wrap" aria-hidden="false">
      <img id="logoImg" src="logo.png" alt="Devant logo" />
      <svg id="logoFallback" viewBox="0 0 1800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Devant logo" style="display:none">
        <g transform="translate(80,40) scale(1.4)">
          <path d="M80 10 L160 10 L205 36 L205 100 C205 158 165 186 160 190 C155 186 115 158 115 100 L115 36 Z" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
          <path d="M142 2 L156 30 L142 24 L128 30 Z" fill="#fff" transform="translate(0,-10)"/>
          <circle cx="140" cy="120" r="48" stroke="#fff" stroke-width="6" fill="none" />
          <g transform="translate(140,120)" fill="#fff">
            <path d="M0 -72 L18 -12 L78 0 L18 12 L0 72 L-18 12 L-78 0 L-18 -12 Z"/>
            <circle cx="0" cy="0" r="18" fill="#000"/>
          </g>
        </g>
        <g transform="translate(460,125)" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="180">
          <text x="0" y="120">DEVANT</text>
        </g>
      </svg>
    </div>

    <!-- Simple tagline -->
    <p class="tagline">Search faster. Build smarter.</p>

    <!-- Search + suggestions -->
    <div class="search-wrapper" aria-live="polite">
      <form id="searchForm" class="search-form" role="search" onsubmit="return onSearch(event)">
        <label for="q" class="visually-hidden">Search</label>
        <input id="q" name="q" type="search" placeholder="Search Devant or the web" autocomplete="off" aria-autocomplete="list" aria-controls="suggestionsList" />
        <button type="submit">Search</button>
        <ul id="suggestionsList" class="suggestions" role="listbox" hidden></ul>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
