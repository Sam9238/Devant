<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Devant</title>
  <link rel="stylesheet" href="Style.css" />
</head>
<body>
  <header class="topbar" role="banner">
    <button id="settingsBtn" class="icon-button" aria-haspopup="true" aria-expanded="false" aria-controls="settingsPanel" title="Settings">
      ⚙️
    </button>

    <div id="settingsPanel" class="settings-panel" role="dialog" aria-label="Search settings" aria-hidden="true">
      <div class="settings-header">
        <h3>Search settings</h3>
        <button id="closeSettings" class="close-btn" aria-label="Close settings">✖</button>
      </div>

      <form id="settingsForm" class="settings-form">
        <div class="setting-row">
          <label for="suggestions">Search suggestions</label>
          <input id="suggestions" type="checkbox" />
        </div>

        <div class="setting-row">
          <label for="safesearch">SafeSearch</label>
          <select id="safesearch">
            <option value="off">Off</option>
            <option value="moderate">Moderate</option>
            <option value="strict">Strict</option>
          </select>
        </div>

        <div class="setting-row">
          <label for="language">Search language</label>
          <select id="language">
            <option value="auto">Auto-detect</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
          </select>
        </div>

        <div class="setting-row">
          <label>Theme</label>
          <div class="theme-options">
            <label><input name="theme" type="radio" value="dark" /> Dark</label>
            <label><input name="theme" type="radio" value="light" /> Light</label>
          </div>
        </div>

        <div class="settings-actions">
          <button id="saveSettings" type="button">Save</button>
          <button id="cancelSettings" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </header>

  <main class="center-page" role="main">
    <!-- Prefer using the uploaded raster/SVG logo (logo.png or logo.svg) -->
    <div class="logo-wrap" aria-hidden="false">
      <img id="logoImg" src="logo.png" alt="Devant logo" />
      <!-- Fallback inline SVG if logo.png not present (keeps white fills so it shows on black) -->
      <svg id="logoSvg" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Devant logo" style="display:none">
        <g transform="translate(40,10)" fill="none" stroke="#FFFFFF" stroke-width="8">
          <path d="M120 12 L200 12 L240 36 L240 92 C240 140 200 170 200 170 C200 170 160 140 160 92 L160 36 Z" fill="none" stroke="#FFFFFF"/>
          <path d="M180 -20 L196 6 L180 0 L164 6 Z" fill="#FFFFFF" stroke="none" transform="translate(40,0)"/>
        </g>
        <g transform="translate(230,90)" fill="#FFFFFF" stroke="none">
          <circle cx="0" cy="0" r="46" stroke="#FFFFFF" stroke-width="6" fill="none"/>
          <path d="M0 -68 L18 -8 L72 0 L18 8 L0 68 L-18 8 L-72 0 L-18 -8 Z" fill="#FFFFFF"/>
          <circle cx="0" cy="0" r="18" fill="#000000"/>
        </g>
        <g transform="translate(430,125)" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="96">
          <text x="0" y="0">DEVANT</text>
        </g>
      </svg>
    </div>

    <form id="searchForm" class="search-form" role="search" onsubmit="return onSearch(event)">
      <label for="q" class="visually-hidden">Search</label>
      <input id="q" name="q" type="search" placeholder="Search Devant or the web" autocomplete="off" />
      <button type="submit">Search</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
