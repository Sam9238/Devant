<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Devant</title>
  <link rel="stylesheet" href="Style.css" />
</head>
<body>
  <header class="topbar">
    <button id="settingsBtn" class="icon-button" aria-label="Open settings" title="Settings">⚙️</button>
  </header>

  <main class="center-page" role="main">
    <img id="logo" src="logo.png" alt="Devant logo" />
    <form id="searchForm" class="search-form" role="search" onsubmit="return onSearch(event)">
      <label for="q" class="visually-hidden">Search</label>
      <input id="q" name="q" type="search" placeholder="Search Devant or the web" autocomplete="off" />
      <button type="submit">Search</button>
    </form>
  </main>

  <!-- Small inline script so page works even if script.js is not present -->
  <script>
    function onSearch(e){
      e.preventDefault();
      const q = document.getElementById('q').value.trim();
      if(!q) return false;
      window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
      return false;
    }
    document.getElementById('settingsBtn')?.addEventListener('click', () => alert('Settings panel not yet implemented.'));
  </script>
</body>
</html>
